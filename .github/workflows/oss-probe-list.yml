name: OSS 防新增对照实验 (cp -r vs sync)

on:
  push:
    branches:
      - chore/oss-probe-list

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup ossutil v2
        run: |
          curl -so ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
          unzip -o ossutil.zip
          chmod 755 ossutil-2.1.2-linux-amd64/ossutil
          echo "$PWD/ossutil-2.1.2-linux-amd64" >> "$GITHUB_PATH"
          ossutil-2.1.2-linux-amd64/ossutil version

      - name: Build test source tree
        run: |
          rm -rf /tmp/src && mkdir -p /tmp/src/sub
          echo root > /tmp/src/root.txt
          echo sub > /tmp/src/sub/sub.txt
          echo "=== local source tree ==="
          find /tmp/src | sort

      - name: cp -r 对照
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ossutil cp -r /tmp/src oss://cn-rdk-front-prod/__oss_dir_test__/cp/ \
            -e https://d-robotics.cc -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
            --region cn-beijing -f 2>&1 | tail -8 || echo "cp exit=$?"

      - name: sync 对照
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ossutil sync /tmp/src oss://cn-rdk-front-prod/__oss_dir_test__/sync/ \
            -e https://d-robotics.cc -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
            --region cn-beijing 2>&1 | tail -8 || echo "sync exit=$?"

      - name: 对比 (目录对象 = 以 / 结尾的行)
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ARGS="-e https://d-robotics.cc -i $OSS_ACCESS_KEY_ID -k $OSS_ACCESS_KEY_SECRET --region cn-beijing"
          echo "===== cp -r 递归 ls ====="
          ossutil ls oss://cn-rdk-front-prod/__oss_dir_test__/cp/ $ARGS 2>&1
          echo "cp 目录对象数(=以/结尾): $(ossutil ls oss://cn-rdk-front-prod/__oss_dir_test__/cp/ $ARGS 2>/dev/null | grep -cE '/[[:space:]]*$' || true)"
          echo ""
          echo "===== sync 递归 ls ====="
          ossutil ls oss://cn-rdk-front-prod/__oss_dir_test__/sync/ $ARGS 2>&1
          echo "sync 目录对象数(=以/结尾): $(ossutil ls oss://cn-rdk-front-prod/__oss_dir_test__/sync/ $ARGS 2>/dev/null | grep -cE '/[[:space:]]*$' || true)"
          echo ""
          echo "===== stat 子目录 key ====="
          echo "-- cp/sub/ --"
          ossutil stat oss://cn-rdk-front-prod/__oss_dir_test__/cp/sub/ $ARGS 2>&1 | grep -iE 'Content-Type|Content-Length|Error|NoSuch|exist' || true
          echo "-- sync/sub/ --"
          ossutil stat oss://cn-rdk-front-prod/__oss_dir_test__/sync/sub/ $ARGS 2>&1 | grep -iE 'Content-Type|Content-Length|Error|NoSuch|exist' || true

      - name: 清理 (always)
        if: always()
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ossutil rm oss://cn-rdk-front-prod/__oss_dir_test__/ -r -f \
            -e https://d-robotics.cc -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
            --region cn-beijing 2>&1 | tail -5 || echo "rm exit=$?"
